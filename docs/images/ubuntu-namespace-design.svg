<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Ubuntu design: openfortivpn in a network namespace next to ExpressVPN</title>
  <desc>The host namespace runs ExpressVPN. The office namespace has its own macvlan NIC on eno2 and runs openfortivpn. Both reach the LAN router; the Fortigate handshake never goes through ExpressVPN.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="720" height="450" fill="#ffffff"/>

  <rect x="230" y="20" width="260" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="360" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">LAN router and Internet</text>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#444441">gateway 192.168.0.254</text>

  <line x1="360" y1="64" x2="360" y2="106" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="110" width="640" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="360" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">eno2 (physical NIC)</text>

  <rect x="40" y="180" width="290" height="230" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="56" y="202" font-size="14" font-weight="bold" fill="#0C447C">Host namespace</text>

  <rect x="390" y="180" width="290" height="230" rx="14" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="406" y="202" font-size="14" font-weight="bold" fill="#3C3489">Office namespace</text>

  <rect x="60" y="222" width="250" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="185" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">ExpressVPN</text>
  <text x="185" y="263" text-anchor="middle" font-size="12" fill="#993C1D">tun0, nftables, route marks</text>

  <rect x="60" y="298" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="185" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Host apps</text>
  <text x="185" y="339" text-anchor="middle" font-size="12" fill="#444441">all traffic via ExpressVPN</text>

  <rect x="410" y="222" width="250" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="535" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">mv-office (macvlan)</text>
  <text x="535" y="263" text-anchor="middle" font-size="12" fill="#444441">192.168.0.200/24, own MAC</text>

  <rect x="410" y="298" width="250" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="535" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#633806">openfortivpn, ppp0</text>
  <text x="535" y="339" text-anchor="middle" font-size="12" fill="#854F0B">routes 10.30/16 and 10.31/16</text>

  <text x="535" y="378" text-anchor="middle" font-size="12" fill="#3C3489">office apps run via ip netns exec office</text>
  <text x="535" y="396" text-anchor="middle" font-size="12" fill="#3C3489">DNS: /etc/netns/office/resolv.conf</text>

  <line x1="185" y1="222" x2="185" y2="150" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="560" y1="222" x2="560" y2="150" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="195" y="168" font-size="12" fill="#444441">tun0 tunnel out</text>
  <text x="570" y="168" font-size="12" fill="#444441">direct to LAN</text>

  <line x1="535" y1="278" x2="535" y2="298" stroke="#444441" stroke-width="1.5"/>

  <text x="360" y="436" text-anchor="middle" font-size="12" fill="#444441">The Fortigate handshake leaves through mv-office, not through ExpressVPN, so the route ExpressVPN keeps changing is never used.</text>
</svg>
